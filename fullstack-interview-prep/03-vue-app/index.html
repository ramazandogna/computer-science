<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vue App — Interview Prep</title>
  </head>
  <body>
    <!--
      This is the ONLY hand-written DOM node. Vue mounts the whole application
      into #app (see src/main.js). This is "Client-Side Rendering" (CSR): the
      server ships a near-empty HTML shell and the JS builds the UI in the
      browser. Compare with module 05 (Next.js) which renders on the server.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
